  /* ---------- Analytics ---------- */
  function track(evento, props) {
    props = props || {};
    var publico = {};
    Object.keys(props).forEach(function (k) { if (k !== 'email') publico[k] = props[k]; });

    try { (window.dataLayer = window.dataLayer || []).push(Object.assign({ event: evento }, publico)); } catch (e) {}

    try {
      if (window.fbq) {
        if (evento === 'email_submitted') window.fbq('track', 'Lead', publico);
        else if (evento === 'offer_clicked') window.fbq('track', 'InitiateCheckout', publico);
        else window.fbq('trackCustom', evento, publico);
      }
    } catch (e) {}

    if (CONFIG.sheetsWebhookUrl) {
      fetch(CONFIG.sheetsWebhookUrl, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(Object.assign({ evento: evento, pagina: CONFIG.pagina, data: new Date().toISOString() }, props))
      }).catch(function () {});
    }

    if (CONFIG.supabaseUrl && CONFIG.supabaseKey && ['quiz_started', 'quiz_completed', 'offer_clicked'].indexOf(evento) !== -1) {
      var linha = { evento: evento };
      if (props.perfil) linha.pilar_resultado = props.perfil;
      if (props.pontuacao) linha.pontuacoes = props.pontuacao;
      fetch(CONFIG.supabaseUrl + '/rest/v1/' + CONFIG.supabaseTabela, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: CONFIG.supabaseKey, Authorization: 'Bearer ' + CONFIG.supabaseKey, Prefer: 'return=minimal' },

      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0'; n.queue = [];

  /* ---------- Pontuação ---------- */
  function calcularPontuacao(respostas) {
    var pontos = {}, principais = {};
    PERFIS_IDS.forEach(function (id) { pontos[id] = 0; principais[id] = 0; });
    PERGUNTAS.forEach(function (p) {
      var alt = p.alternativas.filter(function (a) { return a.id === respostas[p.id]; })[0];
      if (!alt) return;
      Object.keys(alt.pesos).forEach(function (perfil) {
        pontos[perfil] += alt.pesos[perfil];
        if (alt.pesos[perfil] >= 2) principais[perfil] += 1;
      });
    });
    return { pontos: pontos, principais: principais };
  }

  function definirPerfil(respostas) {
    var r = calcularPontuacao(respostas);
    return PRIORIDADE_DESEMPATE.slice().sort(function (a, b) {
      return (r.pontos[b] - r.pontos[a]) || (r.principais[b] - r.principais[a]) ||
        (PRIORIDADE_DESEMPATE.indexOf(a) - PRIORIDADE_DESEMPATE.indexOf(b));
    })[0];
  }

    return PERGUNTAS.every(function (p) { return Boolean(respostas[p.id]); });
  }

  function embaralhar(lista) {
    var c = lista.slice();
    for (var i = c.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = c[i]; c[i] = c[j]; c[j] = t; }
    return c;
  }
  function sortearOrdem() {
    var o = {};
    PERGUNTAS.forEach(function (p) { o[p.id] = embaralhar(p.alternativas.map(function (a) { return a.id; })); });
    return o;
  }

      if (!e) return estadoInicial();
      if (e.etapa === 'analisando' || e.etapa === 'lead') e.etapa = e.perfil ? 'resultado' : 'perguntas';
      if (!e.ordem || !PERGUNTAS.every(function (p) { return e.ordem[p.id] && e.ordem[p.id].length === p.alternativas.length; })) e.ordem = sortearOrdem();

    var obs = new IntersectionObserver(function (entradas) {
      if (entradas[0].isIntersecting) { obs.disconnect(); callback(); }

    obs.observe(el);
  }

              return '<li class="tipo-corpo flex gap-4 text-lg text-cinza-claro"><span class="mt-[0.7em] block h-[7px] w-[7px] shrink-0 bg-laranja" aria-hidden="true"></span>' + esc(a) + '</li>';
            }).join('') + '</ul>') +
          bloco('Por que isso acontece', '<p class="tipo-corpo text-lg text-cinza-claro">' + esc(perfil.porque) + '</p>') +

          // 4. Exemplo prático
          bloco('Na prática',
            '<blockquote class="tipo-titulo text-[clamp(1.5rem,5vw,2.25rem)] text-cinza">“' + fraseComGanchos(ex.situacao, ex.ganchos) + '”</blockquote>' +
            (ex.ganchos && ex.ganchos.length > 2
              ? '<ul class="mt-6 flex flex-wrap gap-2" aria-label="Caminhos possíveis nessa frase">' + ex.ganchos.map(function (g) {
                  return '<li class="rounded-[6px] border border-linha px-3 py-1.5 text-sm font-semibold uppercase tracking-[0.08em] text-papel">' + esc(g) + '</li>';
                }).join('') + '</ul>'
              : '') +
            '<div class="tipo-corpo mt-8 space-y-4 text-lg text-cinza-claro">' + paragrafos(ex.leitura) + '</div>') +

          // 5. Principal mudança
          bloco('A principal mudança', '<p class="tipo-corpo text-xl text-papel">' + esc(perfil.mudanca) + '</p>') +
        '</div>' +

        // 6. Captura opcional de e-mail
        '<section id="captura" aria-label="Receber a análise por e-mail" class="mb-8 mt-4 rounded-[14px] border border-linha bg-superficie p-6 md:p-8">' + captura() + '</section>' +
      '</div>' +

      // 7-9. Método VOC, preço e CTA
      '<section id="oferta" aria-labelledby="oferta-titulo" class="bg-laranja py-16 text-carvao md:py-24">' +
        '<div class="mx-auto w-full px-6 sm:px-8 lg:px-12 grid max-w-[60rem] items-center gap-12 md:grid-cols-[1fr_auto] md:gap-16">' +
          '<div>' +
            '<p class="tipo-corpo max-w-[32rem] text-lg">' + esc(perfil.proximoPasso) + '</p>' +
            '<h2 id="oferta-titulo" class="tipo-titulo mt-5 text-[clamp(2rem,7vw,3.25rem)]">É exatamente isso que o Método VOC ensina.</h2>' +
            '<div class="mt-10 border-t-2 border-carvao pt-8">' +
              '<p class="text-lg font-semibold">' + esc(CONFIG.nomeProduto) + '</p>' +
              '<p class="mt-1 text-sm">E-book em PDF</p>' +
              '<p class="tipo-display mt-4 text-[clamp(3rem,10vw,4.5rem)] leading-none">' + esc(CONFIG.preco) + '</p>' +
              '<a id="cta-oferta" href="' + esc(CONFIG.checkoutUrl || '#') + '" class="group relative isolate inline-flex items-center justify-center overflow-hidden rounded-[10px] font-semibold uppercase tracking-[0.06em] transition-transform duration-150 ease-out active:scale-[0.97] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-4 motion-reduce:transition-none min-h-[60px] px-5 text-[0.875rem] sm:px-8 sm:text-[0.9375rem] bg-carvao text-papel focus-visible:ring-carvao focus-visible:ring-offset-laranja mt-8 w-full sm:w-auto">' +
                PREENCHIMENTO + '<span class="transition-colors duration-300 group-hover:text-carvao group-focus-visible:text-carvao">Quero aprender o Método VOC</span></a>' +
            '</div>' +
          '</div>' +
          '<div class="flex justify-center">' + LIVRO + '</div>' +
        '</div>' +
      '</section>' +

      '<div class="' + CONTAINER + ' py-12">' +
        '<p class="text-sm leading-relaxed text-cinza">Esta análise é informal e baseada apenas nas suas respostas. Não é uma avaliação psicológica.</p>' +
        '<button type="button" id="btn-refazer" class="mt-4 rounded-sm text-sm text-cinza-claro underline decoration-linha underline-offset-[6px] transition-colors hover:text-papel hover:decoration-laranja focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-laranja">Refazer a análise</button>' +
      '</div>';

    window.scrollTo(0, 0);
    track('result_viewed', { perfil: estado.perfil });
    if (!estado.email) aoAparecer(document.getElementById('captura'), function () { track('email_capture_viewed', { perfil: estado.perfil }); });
    aoAparecer(document.getElementById('oferta'), function () { track('offer_viewed', { perfil: estado.perfil }); });
    ligarCaptura();

    document.getElementById('cta-oferta').addEventListener('click', function () {
      track('offer_clicked', { perfil: estado.perfil });
    });
    document.getElementById('btn-refazer').addEventListener('click', function () {
      var email = estado.email;
      estado = estadoInicial();
      estado.email = email;
      salvar();
      render();
    });
  }

  function render() {
    if (estado.etapa === 'perguntas') return telaPergunta();
    if (estado.etapa === 'analisando') return telaAnalisando();
    if (estado.etapa === 'resultado' && estado.perfil) return telaResultado();
    return telaIntro();
  }

  iniciarMetaPixel();
  render();
})();

</script>
</body>
</html>
